apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backup-controller.fullname" . }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "backup-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backup-controller.selectorLabels" . | nindent 8 }}
    spec:
      # The client reads the API server address and CA from the mounted token,
      # so the pod keeps the default automount and asks for no other projected
      # credential.
      serviceAccountName: {{ include "backup-controller.serviceAccountName" . }}
      containers:
      - name: controller
        image: {{ include "backup-controller.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # The prime claim and the ReplicationDestination live in this
        # namespace, which is the library's namespace setting. The metrics
        # listen address and path keep their defaults, :8080 and /metrics.
        args:
        - --namespace={{ .Values.namespace }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        # The library registers only the configured metrics path and serves no
        # health route, so this container declares no liveness or readiness
        # probe: a probe against the metrics port would prove the process
        # listens and nothing about its state. The image is a static binary on
        # scratch with no writable path, and the container runs with no
        # capabilities, which is what lets the root filesystem stay read-only.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
