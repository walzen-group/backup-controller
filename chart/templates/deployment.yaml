apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backup-controller.fullname" . }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The controller runs without leader election, so two pods would run two
  # schedulers and two sets of reconcilers. Recreate stops the old pod before
  # the new one starts, where the default RollingUpdate overlaps them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "backup-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backup-controller.selectorLabels" . | nindent 8 }}
    spec:
      # The client reads the API server address and CA from the mounted token,
      # so the pod keeps the default automount and asks for no other projected
      # credential.
      serviceAccountName: {{ include "backup-controller.serviceAccountName" . }}
      containers:
      - name: controller
        image: {{ include "backup-controller.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # The prime claim and the ReplicationDestination live in this
        # namespace, which is the library's namespace setting. The metrics
        # listen address and path keep their defaults, :8080 and /metrics.
        args:
        - --namespace={{ .Values.namespace }}
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-dir=/etc/webhook/tls
        - --webhook-port={{ .Values.webhook.port }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        # The scheduler's series: each namespace's last successful backup
        # and schedule interval, which the backup alerts read.
        - name: runs-metrics
          containerPort: 8081
          protocol: TCP
        # The run controllers' manager serves /healthz and /readyz here
        # (--health-probe-addr, default :8082).
        - name: health
          containerPort: 8082
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - name: webhook
          containerPort: {{ .Values.webhook.port }}
          protocol: TCP
        # cert-manager writes tls.crt and tls.key here and rewrites them on
        # renewal. controller-runtime watches the directory and reloads the
        # certificate without a restart, so a renewal is not an outage.
        volumeMounts:
        - name: webhook-tls
          mountPath: /etc/webhook/tls
          readOnly: true
        {{- end }}
        # /healthz answers while the manager runs. A manager that stops exits
        # the process, so the liveness probe covers a manager that hangs.
        # /readyz waits until the webhook server, when there is one, accepts
        # TLS connections, so the webhook's Service sends the API server to
        # this pod only once it can answer. The populator library serves no
        # health route of its own, and exits the process when it fails.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        # The image is a static binary on scratch with no writable path, and
        # the container runs with no capabilities, which is what lets the root
        # filesystem stay read-only.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- if .Values.webhook.enabled }}
      volumes:
      - name: webhook-tls
        secret:
          secretName: {{ include "backup-controller.fullname" . }}-webhook-tls
      {{- end }}
