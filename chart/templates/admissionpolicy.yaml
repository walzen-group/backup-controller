{{- if .Values.admissionPolicy.create }}
{{- $name := printf "%s-restore-jobs" (include "backup-controller.fullname" .) }}
# Lets the controller's ServiceAccount create and change only Jobs of the
# restore Job's shape (internal/restorejob), and delete only its own labelled
# Jobs. Other users' Jobs are not matched. RBAC cannot scope the jobs grant this
# way; see docs/decisions.md.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
    # A named version lets the API server type-check the expressions that read
    # object and oldObject directly; with matchPolicy Equivalent the rule still
    # matches a Job written through any later batch version.
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["jobs"]
  matchConditions:
  - name: the-controller-only
    expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ include "backup-controller.serviceAccountName" . }}'"
  variables:
  - name: job
    expression: "request.operation == 'DELETE' ? oldObject : object"
  - name: labelled
    expression: >-
      has(variables.job.metadata.labels) &&
      'app.kubernetes.io/managed-by' in variables.job.metadata.labels &&
      variables.job.metadata.labels['app.kubernetes.io/managed-by'] == 'backup-controller' &&
      'app.kubernetes.io/component' in variables.job.metadata.labels &&
      variables.job.metadata.labels['app.kubernetes.io/component'] == 'restore'
  - name: pod
    expression: "object.spec.template.spec"
  - name: containers
    expression: >-
      variables.pod.containers +
      (has(variables.pod.initContainers) ? variables.pod.initContainers : [])
  validations:
  - expression: "variables.labelled"
    reason: Forbidden
    message: "backup-controller may create, change and delete only Jobs labelled app.kubernetes.io/managed-by=backup-controller and app.kubernetes.io/component=restore"
  - expression: >-
      request.operation != 'UPDATE' ||
      (has(oldObject.metadata.labels) &&
       oldObject.metadata.labels.exists(k, k == 'app.kubernetes.io/managed-by' && oldObject.metadata.labels[k] == 'backup-controller'))
    reason: Forbidden
    message: "backup-controller may change only a Job it created"
  - expression: >-
      request.operation == 'DELETE' ||
      (has(object.spec.template.metadata.labels) &&
       'app.kubernetes.io/component' in object.spec.template.metadata.labels &&
       object.spec.template.metadata.labels['app.kubernetes.io/component'] == 'restore')
    reason: Forbidden
    message: "a restore Job's pods carry app.kubernetes.io/component=restore"
  - expression: >-
      request.operation == 'DELETE' ||
      (has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false)
    reason: Forbidden
    message: "a restore Job's pod mounts no ServiceAccount token"
  # Without a token the pod still runs as a ServiceAccount, and that account
  # decides the pull secrets it gets. Build names none, so the pod runs as its
  # namespace's default account, never as the controller's own.
  - expression: >-
      request.operation == 'DELETE' ||
      ((!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == 'default') &&
       (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == 'default'))
    reason: Forbidden
    message: "a restore Job's pod runs as its namespace's default ServiceAccount"
  - expression: >-
      request.operation == 'DELETE' ||
      (!(has(variables.pod.hostNetwork) && variables.pod.hostNetwork) &&
       !(has(variables.pod.hostPID) && variables.pod.hostPID) &&
       !(has(variables.pod.hostIPC) && variables.pod.hostIPC) &&
       !has(variables.pod.nodeName) && !has(variables.pod.ephemeralContainers) &&
       !has(variables.pod.resourceClaims))
    reason: Forbidden
    message: "a restore Job's pod uses no host namespace, names no node, and claims no device"
  - expression: >-
      request.operation == 'DELETE' || !has(variables.pod.volumes) ||
      variables.pod.volumes.all(v,
        has(v.persistentVolumeClaim) || has(v.emptyDir) ||
        (has(v.ephemeral) &&
         !has(v.ephemeral.volumeClaimTemplate.spec.dataSource) &&
         !has(v.ephemeral.volumeClaimTemplate.spec.dataSourceRef)))
    reason: Forbidden
    message: "a restore Job's pod mounts only claims, emptyDir and ephemeral claims without a data source"
  - expression: >-
      request.operation == 'DELETE' || !has(variables.pod.securityContext) ||
      (!has(variables.pod.securityContext.sysctls) &&
       !has(variables.pod.securityContext.seLinuxOptions) &&
       !(has(variables.pod.securityContext.seccompProfile) && variables.pod.securityContext.seccompProfile.type == 'Unconfined') &&
       !(has(variables.pod.securityContext.appArmorProfile) && variables.pod.securityContext.appArmorProfile.type == 'Unconfined'))
    reason: Forbidden
    message: "a restore Job's pod security context sets no sysctls, SELinux options or unconfined profile"
  - expression: >-
      request.operation == 'DELETE' ||
      variables.containers.all(c,
        has(c.securityContext) &&
        !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
        has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
        has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop &&
        (!has(c.securityContext.capabilities.add) ||
         c.securityContext.capabilities.add.all(a, a in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER'])) &&
        !has(c.securityContext.seLinuxOptions) &&
        !(has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'Unconfined') &&
        !(has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined') &&
        (!has(c.securityContext.procMount) || c.securityContext.procMount == 'Default') &&
        !has(c.volumeDevices) &&
        (!has(c.ports) || c.ports.all(p, !has(p.hostPort))))
    reason: Forbidden
    message: "a restore Job's containers are unprivileged: drop ALL, add at most CHOWN, DAC_OVERRIDE and FOWNER, no privilege escalation, read-only root, no host port or device"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
