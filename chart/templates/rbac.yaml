{{- if .Values.rbac.create }}
# Every rule here traces to a caller in the controller.
#
# The library creates the prime claim for each restore, copies the app claim's
# storage class, size and selected node onto it, and patches the volume's claim
# reference to the app claim when the restore completes. Its watchers read
# through the informer cache, so list and watch carry the reads and get is
# granted for the objects it fetches by name. The recorder writes the events an
# operator reads with kubectl describe.
#
# The secrets grant is the line worth arguing about: a restore copies the
# repository Secret from the claim's namespace into the controller namespace
# and deletes that copy when the restore ends, and RBAC cannot scope a rule to
# Secrets whose names match a pattern, so the grant covers every Secret in the
# cluster. docs/decisions.md records the alternative that avoids it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backup-controller.fullname" . }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
rules:
  # The app claim, the prime claim and the restored volume.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # The library builds a pod informer whether or not a populator pod is used,
  # and waits for its cache to sync before the controller runs at all
  # (populator-machinery/controller.go:289 and :542). Without this rule the
  # reflector fails every few seconds, the cache never syncs, and every claim
  # stays Pending with nothing on it saying why.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The data source the claim names. create is for a RestoreRun writing the
  # point-in-time VolumeRestore its scratch claim is filled from. update is
  # for the populator adding and removing its backup.wlz.li/volume-populator
  # finalizer.
  - apiGroups: ["backup.wlz.li"]
    resources: ["volumerestores"]
    verbs: ["get", "list", "watch", "create", "update"]
  # The conditions the controller reports on a VolumeRestore.
  - apiGroups: ["backup.wlz.li"]
    resources: ["volumerestores/status"]
    verbs: ["patch", "update"]
  # The one-shot runs, and the finalizer each carries. Without update on the
  # objects themselves the finalizer cannot be added or removed, and a run that
  # cannot drop its finalizer can never be deleted. create is the scheduler
  # writing a BackupRun at each tick of a namespace's schedule.
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["backup.wlz.li"]
    resources: ["restoreruns"]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns/status", "restoreruns/status"]
    verbs: ["patch", "update"]
  # The Workload, scratch claim and VolumeRestore a run creates name the run
  # as their controller, and each ReplicationSource names its claim, with
  # blockOwnerDeletion set. An API server running the
  # OwnerReferencesPermissionEnforcement admission plugin refuses such a
  # reference unless the writer may update the owner's finalizers.
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns/finalizers", "restoreruns/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/finalizers"]
    verbs: ["update"]
  # The controller writes each enabled claim's source and triggers it with a
  # manual tag. A BackupRun whose mover failed deletes the claim's source.
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The scheduler reads each namespace's backup.wlz.li/schedule annotation.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # A base backup on demand, through the barman-cloud plugin.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "create"]
  # Quiesce scales a marked workload to zero and back, and suspends the Flux
  # Kustomization that would otherwise put the replicas back mid-run.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
  # A run is admitted as one Kueue Workload. The run sets its PodsReady
  # condition itself, because the Workload has no pods to report it.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads/status"]
    verbs: ["update"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["list"]
  # One destination per restore, created and removed by the callbacks and by a
  # RestoreRun.
  - apiGroups: ["volsync.backube"]
    resources: ["replicationdestinations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The repository Secret copy the populator writes for the length of a
  # restore.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  # The recorder the library hands to the callbacks.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The run controllers' recorder, which writes an event on a BackupRun or
  # RestoreRun each time its Ready reason changes.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The bootstrap webhook reads the object store a Cluster archives through, to
  # find the bucket, the endpoint and the Secret holding its keys. get alone,
  # because the handler fetches one store by the name the Cluster gave it and
  # goes through the uncached reader.
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get"]
  # Before admitting a Cluster the webhook checks that no other database
  # already archives to the same bucket and prefix, which would interleave
  # their WAL and leave the archive unrestorable. That question is only
  # answerable by looking at every Cluster on the cluster. A database run
  # reads its Cluster, and a restore deletes it so it is created again.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backup-controller.fullname" . }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backup-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
