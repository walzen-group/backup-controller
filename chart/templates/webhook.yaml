{{- if .Values.webhook.enabled }}
{{- $name := include "backup-controller.fullname" . }}
{{- $webhookName := printf "%s-webhook" $name }}
{{- if .Values.webhook.certManager.create }}
# cert-manager issues and renews the serving certificate and injects the CA
# into the webhook configuration, so nothing here expires on a date somebody
# has to remember. The issuer is self-signed because the only party that has to
# trust this certificate is the API server.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $webhookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $webhookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  secretName: {{ $webhookName }}-tls
  dnsNames:
    - {{ $webhookName }}.{{ .Release.Namespace }}.svc
    - {{ $webhookName }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ $webhookName }}
    kind: Issuer
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $webhookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "backup-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
---
# failurePolicy is Fail on purpose. A webhook that is unavailable would
# otherwise let a Cluster be created exactly as written, which is initdb, which
# is a silently empty database beside a full archive. Refusing the creation is
# the loud failure, and it is the one worth having during a cluster rebuild.
#
# The second entry takes updates, where the handler drops the initdb that Flux
# re-applies from git over a recovered Cluster. It ignores failures so an
# unavailable controller blocks no update to any other Cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $name }}-bootstrap
  labels:
    {{- include "backup-controller.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.create }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $webhookName }}
  {{- end }}
webhooks:
  - name: bootstrap.backup.wlz.li
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 15
    rules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        resources: ["clusters"]
        operations: ["CREATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: {{ $webhookName }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-postgresql-cnpg-io-v1-cluster
        port: 443
  - name: bootstrap-update.backup.wlz.li
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    rules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        resources: ["clusters"]
        operations: ["UPDATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: {{ $webhookName }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-postgresql-cnpg-io-v1-cluster
        port: 443
{{- end }}
