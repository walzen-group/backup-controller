# Cluster-wide objects the tests use: the StorageClass and VolumeSnapshotClass
# of the host path CSI driver, the Kueue queue that admits backup and restore
# work, and the OCI registry Flux reads the test apps from.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-hostpath
provisioner: hostpath.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-hostpath
driver: hostpath.csi.k8s.io
deletionPolicy: Delete
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default
---
# The quota admits 5 runs at once, as on prod: each run's Workload asks for
# one "backup-controller.wlz.li/run".
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: backup
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: [cpu, memory, backup-controller.wlz.li/run]
      flavors:
        - name: default
          resources:
            - {name: cpu, nominalQuota: "16"}
            - {name: memory, nominalQuota: 32Gi}
            - {name: backup-controller.wlz.li/run, nominalQuota: 5}
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: REGISTRY_IMAGE
          ports:
            - {name: http, containerPort: 5000}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector: {app: registry}
  ports:
    - {name: http, port: 5000, targetPort: http}
