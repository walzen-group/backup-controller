apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-controller
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/instance: backup-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
      app.kubernetes.io/instance: backup-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-controller
        app.kubernetes.io/instance: backup-controller
    spec:
      # The client reads the API server address and CA from the mounted
      # token, so the pod keeps the default automount and asks for no other
      # projected credential.
      serviceAccountName: backup-controller
      containers:
      - name: controller
        image: ghcr.io/walzen-group/backup-controller:v0.1.0
        imagePullPolicy: IfNotPresent
        # The prime claim and the ReplicationDestination live in this
        # namespace, which is the library's namespace setting. The metrics
        # listen address and path keep their defaults, :8080 and /metrics.
        args:
        - --namespace=backup-system
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        # The library registers only the configured metrics path and serves no
        # health route, so this container declares no liveness or readiness
        # probe: a probe against the metrics port would prove the process
        # listens and nothing about its state. The image is a static binary on
        # scratch with no writable path, and the container runs with no
        # capabilities, which is what lets the root filesystem stay read-only.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # No CPU limit: throttling a controller during a restore delays the
        # copy without protecting the node it runs on.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
