apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-controller
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/instance: backup-controller
spec:
  replicas: 1
  # The controller runs without leader election, so two pods would run two
  # schedulers and two sets of reconcilers. Recreate stops the old pod before
  # the new one starts, where the default RollingUpdate overlaps them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
      app.kubernetes.io/instance: backup-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-controller
        app.kubernetes.io/instance: backup-controller
    spec:
      # The client reads the API server address and CA from the mounted
      # token, so the pod keeps the default automount and asks for no other
      # projected credential.
      serviceAccountName: backup-controller
      containers:
      - name: controller
        image: ghcr.io/walzen-group/backup-controller:v0.1.0
        imagePullPolicy: IfNotPresent
        # The prime claims, the Secret copies and the restore Jobs live in this
        # namespace, which is the library's namespace setting. The metrics
        # listen address and path keep their defaults, :8080 and /metrics.
        #
        # The controller also needs --restore-image, the image its restore
        # Jobs run restic in, and refuses to start without it. This manifest
        # leaves it out, because only the installer knows the image VolSync
        # runs its restic mover in: append
        # --restore-image=<image>@sha256:<digest> to these args when you
        # install, as the infra module and the e2e setup do.
        args:
        - --namespace=backup-system
        - --webhook-cert-dir=/etc/webhook/tls
        # The Go runtime collects garbage before the heap reaches the
        # container's memory limit. Without GOMEMLIMIT it collects only when
        # the heap doubles, and the 32 MiB a restic key derivation leaves
        # behind grew the heap past the limit until the kubelet OOMKilled
        # the pod. The divisor of 1 hands the limit over in bytes.
        env:
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: controller
              resource: limits.memory
              divisor: "1"
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        # The scheduler's series: each namespace's last successful backup
        # and schedule interval, which the backup alerts read.
        - name: runs-metrics
          containerPort: 8081
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        # The run controllers' manager serves /healthz and /readyz here
        # (--health-probe-addr, default :8082).
        - name: health
          containerPort: 8082
          protocol: TCP
        # cert-manager writes tls.crt and tls.key here and rewrites them on
        # renewal. controller-runtime watches the directory and reloads the
        # certificate without a restart, so a renewal is not an outage.
        volumeMounts:
        - name: webhook-tls
          mountPath: /etc/webhook/tls
          readOnly: true
        # /healthz answers while the manager runs. A manager that stops exits
        # the process, so the liveness probe covers a manager that hangs.
        # /readyz waits until the webhook server accepts TLS connections, so
        # the webhook's Service sends the API server to this pod only once it
        # can answer. The populator library serves no health route of its own,
        # and exits the process when it fails.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        # The image is a static binary on scratch with no writable path, and
        # the container runs with no capabilities, which is what lets the root
        # filesystem stay read-only.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # No CPU limit: throttling a controller during a restore delays the
        # copy without protecting the node it runs on. The process rests at
        # about 50Mi, and a restic key derivation holds 32Mi more while it
        # runs; 128Mi left too little room, and the controller was OOMKilled.
        # The request is 256Mi, so the scheduler keeps that memory for the
        # controller.
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 512Mi
      volumes:
      - name: webhook-tls
        secret:
          secretName: backup-controller-webhook-tls
