# Verbatim copies of the CRDs generated under config/crd/. controller-gen owns
# the originals and `make manifests` copies them here, so a new kind needs an
# entry below and nothing else. `make verify` diffs this directory against
# config/crd and fails on any drift.
#
# Every CRD belongs in the release asset: the render carries them beside the
# workload, so the infrastructure module applies the whole install from a single
# fetch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backup.wlz.li_volumerestores.yaml
  - backup.wlz.li_backupruns.yaml
  - backup.wlz.li_restoreruns.yaml
