---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: backupruns.backup.wlz.li
spec:
  group: backup.wlz.li
  names:
    kind: BackupRun
    listKind: BackupRunList
    plural: backupruns
    shortNames:
    - brun
    singular: backuprun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupRun takes one backup of a volume on demand. Submit it and watch it the
          way you would a Job; the controller writes the source's manual trigger, waits
          for the mover, and takes the trigger away again.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupRunSpec asks for one backup of a volume, now, outside its schedule.

              A ReplicationSource takes its backups on a cronspec. Running one on demand
              means giving it a manual trigger and taking that trigger away again when the
              run is over, because a manual tag wins wherever both are set and a source
              left holding a spent tag reports healthy while taking no further backups.
              This object exists so that sequence belongs to a controller rather than to
              whoever remembered to finish it.
            properties:
              source:
                description: Source is the ReplicationSource in this namespace to
                  run.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              timeout:
                default: 1h
                description: |-
                  Timeout is how long to wait for the mover before giving up. On expiry the
                  run fails and the trigger is cleared, so a mover that never finishes
                  leaves the source back on its schedule rather than silently stopped.
                type: string
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished deletes this object that long after it reaches a
                  terminal phase. Omitted, it is kept, which is usually what you want: the
                  question "did my backup before that restore actually finish" is worth
                  being able to answer later.
                format: int32
                minimum: 0
                type: integer
            required:
            - source
            type: object
          status:
            description: BackupRunStatus reports how far the run got.
            properties:
              completedAt:
                description: CompletedAt is when the run reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions carry the kstatus-compatible state, so a Flux Kustomization
                  with wait: true can gate on this object.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              phase:
                description: Phase is the run's state, and the column `kubectl get`
                  prints.
                type: string
              snapshotTime:
                description: |-
                  SnapshotTime is the source's lastSyncTime for this run, which is the
                  moment the repository holds.
                format: date-time
                type: string
              startedAt:
                description: StartedAt is when the trigger was written.
                format: date-time
                type: string
              trigger:
                description: |-
                  Trigger is the manual tag this run wrote onto the source. It is derived
                  from the run's UID, so a controller that restarts mid-run recomputes the
                  same value and continues rather than starting a second backup.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
