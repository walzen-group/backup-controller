---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: backupruns.backup.wlz.li
spec:
  group: backup.wlz.li
  names:
    kind: BackupRun
    listKind: BackupRunList
    plural: backupruns
    shortNames:
    - brun
    singular: backuprun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .spec.database
      name: Database
      type: string
    - jsonPath: .spec.all
      name: All
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupRun takes one backup on demand, and is also the record the scheduler
          leaves for every scheduled backup. Submit it and watch it the way you would
          a Job.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupRunSpec asks for one backup now: of one volume, of one database, or of
              everything the namespace marks backup.wlz.li/enabled.

              The controller writes and triggers each volume's ReplicationSource itself,
              named after the claim, and asks CloudNativePG for a base backup of each
              database. A run with all set is admitted by the namespace's Kueue queue as
              one unit and stops the workloads marked backup.wlz.li/quiesce until every
              volume's clone is cut.
            properties:
              all:
                description: |-
                  All backs up every claim and every Cluster in this namespace marked
                  backup.wlz.li/enabled, and stops the workloads marked
                  backup.wlz.li/quiesce while the clones are cut.
                type: boolean
              database:
                description: |-
                  Database is the CloudNativePG Cluster in this namespace to take a base
                  backup of.
                maxLength: 253
                type: string
              source:
                description: |-
                  Source is the claim to back up. Its ReplicationSource carries the same
                  name, and the claim has to be marked backup.wlz.li/enabled.
                maxLength: 253
                type: string
              timeout:
                description: |-
                  Timeout is how long the run waits for its movers and base backups
                  before it gives up. Admission by the queue does not count toward it.
                  Omitted, the namespace's backup.wlz.li/timeout annotation applies, and
                  six hours without one.
                type: string
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished deletes this object that long after it reaches a
                  terminal phase. Omitted, it is kept as the record of what was backed up.
                format: int32
                minimum: 0
                type: integer
            type: object
            x-kubernetes-validations:
            - message: set exactly one of source, database and all
              rule: '(has(self.source) ? 1 : 0) + (has(self.database) ? 1 : 0) + ((has(self.all)
                && self.all) ? 1 : 0) == 1'
          status:
            description: BackupRunStatus reports how far the run got.
            properties:
              completedAt:
                description: CompletedAt is when the run reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions carry the kstatus-compatible state, so a Flux Kustomization
                  with wait: true can gate on this object.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              items:
                description: Items has one entry per volume and database the run backs
                  up.
                items:
                  description: BackupItem is one volume or database a BackupRun backs
                    up.
                  properties:
                    backup:
                      description: Backup is the CloudNativePG Backup the run created
                        for a database.
                      type: string
                    empty:
                      description: |-
                        Empty reports a volume VolSync did not back up because it held no
                        files. The repository gains no snapshot for such a run.
                      type: boolean
                    kind:
                      description: Kind is ReplicationSource for a volume and Cluster
                        for a database.
                      type: string
                    message:
                      description: Message says why an item failed or was skipped.
                      type: string
                    name:
                      description: Name is the object's name, which for a volume is
                        also the claim's.
                      type: string
                    phase:
                      description: Phase is how far this item got.
                      type: string
                    snapshot:
                      description: Snapshot is the restic snapshot the mover wrote,
                        as its short ID.
                      type: string
                    snapshotTime:
                      description: |-
                        SnapshotTime is the time on that snapshot. restic stamps the moment the
                        backup of the volume's clone started; a run that stopped workloads then
                        moves the snapshot to its restartedAt and tags it quiesced, so a restore
                        can recover the databases to the same moment.
                      format: date-time
                      type: string
                    trigger:
                      description: Trigger is the manual tag the run wrote onto a
                        ReplicationSource.
                      type: string
                  required:
                  - kind
                  - name
                  - phase
                  type: object
                type: array
              phase:
                description: Phase is the run's state, and the column `kubectl get`
                  prints.
                type: string
              quiesced:
                description: |-
                  Quiesced lists the workloads this run scaled to zero, with the replicas
                  it gives each back.
                items:
                  description: QuiescedWorkload is one workload a run stopped.
                  properties:
                    kind:
                      description: Kind is Deployment or StatefulSet.
                      type: string
                    name:
                      description: Name is the workload's name in the run's namespace.
                      type: string
                    replicas:
                      description: Replicas is what the workload ran with before the
                        run stopped it.
                      format: int32
                      type: integer
                  required:
                  - kind
                  - name
                  - replicas
                  type: object
                type: array
              quiescedAt:
                description: |-
                  QuiescedAt is when the run stopped the workloads marked
                  backup.wlz.li/quiesce, or found none to stop.
                format: date-time
                type: string
              restartedAt:
                description: RestartedAt is when the run gave those workloads their
                  replicas back.
                format: date-time
                type: string
              startedAt:
                description: StartedAt is when the run was admitted and began backing
                  up.
                format: date-time
                type: string
              suspendedKustomizations:
                description: |-
                  SuspendedKustomizations lists the Flux Kustomizations this run
                  suspended, as namespace/name. The run resumes exactly these.
                items:
                  type: string
                type: array
              workload:
                description: Workload is the Kueue Workload that admits the run, while
                  it exists.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
