apiVersion: v1
kind: Namespace
metadata:
  name: backup-system
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/component: control-plane
    # The controller runs as a non-root user with a read-only root filesystem
    # and no capabilities, so it satisfies the restricted pod security
    # standard and this namespace states no level of its own.
