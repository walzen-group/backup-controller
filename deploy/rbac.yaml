# Every rule here traces to a caller in the controller.
#
# The library creates the prime claim for each restore, copies the app claim's
# storage class, size and selected node onto it, and patches the volume's claim
# reference to the app claim when the restore completes. Its watchers read
# through the informer cache, so list and watch carry the reads and get is
# granted for the objects it fetches by name. The recorder writes the events an
# operator reads with kubectl describe.
#
# The secrets grant is the line worth arguing about: a restore copies the
# repository Secret from the claim's namespace into the controller namespace
# and deletes that copy when the restore ends, and RBAC cannot scope a rule to
# Secrets whose names match a pattern, so the grant covers every Secret in the
# cluster. docs/decisions.md records the alternative that avoids it.
#
# The status rules cover the controller's own writes to a VolumeRestore, which
# the library performs as subresource updates and patches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-controller
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/instance: backup-controller
rules:
  # The app claim, the prime claim and the restored volume. The populator
  # orphan reconciler (internal/populator/orphans.go) also watches claims,
  # deletes the prime of a claim whose VolumeRestore is gone, and patches the
  # library's finalizer off that claim.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # The library builds a pod informer whether or not a populator pod is used,
  # and waits for its cache to sync before the controller runs at all
  # (populator-machinery/controller.go:289 and :542). Without this rule the
  # reflector fails every few seconds, the cache never syncs, and every claim
  # stays Pending with nothing on it saying why. The populator orphan
  # reconciler (internal/populator/orphans.go) and a RestoreRun that stops
  # a restore mover (moverRemains in internal/runs/restorerun.go) list the
  # pods of that mover's Job, and wait while one is still there.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The data source the claim names. update is for the populator adding and
  # removing its backup.wlz.li/volume-populator finalizer. The populator
  # orphan reconciler watches VolumeRestores and reads one by name to learn
  # that it is gone.
  - apiGroups: ["backup.wlz.li"]
    resources: ["volumerestores"]
    verbs: ["get", "list", "watch", "update"]
  # The conditions the controller reports on a VolumeRestore.
  - apiGroups: ["backup.wlz.li"]
    resources: ["volumerestores/status"]
    verbs: ["patch", "update"]
  # The one-shot runs, and the finalizer each carries. Without update on the
  # objects themselves the finalizer cannot be added or removed, and a run that
  # cannot drop its finalizer can never be deleted. create is the scheduler
  # writing a BackupRun at each tick of a namespace's schedule.
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["backup.wlz.li"]
    resources: ["restoreruns"]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns/status", "restoreruns/status"]
    verbs: ["patch", "update"]
  # The Workload, scratch claim and VolumeRestore a run creates name the run
  # as their controller, and each ReplicationSource names its claim, with
  # blockOwnerDeletion set. An API server running the
  # OwnerReferencesPermissionEnforcement admission plugin refuses such a
  # reference unless the writer may update the owner's finalizers.
  - apiGroups: ["backup.wlz.li"]
    resources: ["backupruns/finalizers", "restoreruns/finalizers"]
    verbs: ["update"]
  # A run reads the installed CRD of its kind before it changes anything, and
  # refuses to start (reason CRDOutdated) when the schema lacks a field the
  # controller writes. An API server with an older CRD drops such a field, so
  # a quiesced run could lose track of the workloads it stopped. Only get,
  # and only on the BackupRun and RestoreRun CRDs, the two a run checks.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["backupruns.backup.wlz.li", "restoreruns.backup.wlz.li"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/finalizers"]
    verbs: ["update"]
  # The controller writes each enabled claim's source and triggers it with a
  # manual tag. It never deletes one: a source belongs to its claim.
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The scheduler reads each namespace's backup.wlz.li/schedule annotation.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # A base backup on demand, through the barman-cloud plugin.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "create"]
  # Quiesce scales a marked workload to zero and back, and suspends the Flux
  # Kustomization that would otherwise put the replicas back mid-run.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
  # A run is admitted as one Kueue Workload. The run sets its PodsReady
  # condition itself, because the Workload has no pods to report it.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads/status"]
    verbs: ["update"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["list"]
  # One destination per restore, created and removed by the callbacks and by a
  # RestoreRun. The populator orphan reconciler deletes the destination of a
  # claim whose VolumeRestore is gone.
  - apiGroups: ["volsync.backube"]
    resources: ["replicationdestinations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The restore Job (internal/restorejob) runs restic for a RestoreRun or the
  # populator: the controller creates it, reads it by name, suspends it with a
  # merge patch and deletes it with Foreground propagation, and a RestoreRun
  # lists its own restore Jobs by label for the exclusion check. Reads go
  # through the uncached reader, so no watch. The Job's pods are listed by
  # their controller-uid label under the pods rule above. A RestoreRun that
  # stops a VolSync mover (moverRemains in internal/runs/restorerun.go) and
  # the populator orphan reconciler (internal/populator/orphans.go) read the
  # mover's Job by name with get, until the restore moves to the Job. RBAC
  # cannot scope the rule to the controller's own Jobs; create and delete
  # cover every Job in the cluster.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # The Leases the runs take (internal/runs/lease.go): one on a claim and on
  # its repository Secret right before a mover starts, so a backup and a
  # restore of either never run at once; and one per namespace before a run
  # stops that namespace's workloads, so two runs never stop the same
  # workload. Runs live in every namespace, so the rule is cluster-wide. get
  # and list go through the uncached reader, so no watch; update takes over the
  # Lease of a run that has finished or given its workloads back.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
  # The repository Secret copy the populator writes for the length of a
  # restore. The populator orphan reconciler deletes the copy of a claim whose
  # VolumeRestore is gone.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  # The recorder the library hands to the callbacks.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The run controllers' recorder, which writes an event on a BackupRun or
  # RestoreRun each time its Ready reason changes. The populator orphan
  # reconciler writes its WaitingForMover and DataSourceGone events on a claim
  # through the same recorder.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The bootstrap webhook reads the object store a Cluster archives through, to
  # find the bucket, the endpoint and the Secret holding its keys: get for the
  # admitted Cluster's own store, and list for the collision check, which reads
  # every other Cluster's store in one call. Both go through the uncached
  # reader, so no watch.
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list"]
  # Before admitting a Cluster the webhook checks that no other database
  # already archives to the same bucket and prefix, which would interleave
  # their WAL and leave the archive unrestorable. That question is only
  # answerable by looking at every Cluster on the cluster. A database run
  # reads its Cluster, and a restore deletes it so it is created again.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-controller
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/instance: backup-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-controller
subjects:
  - kind: ServiceAccount
    name: backup-controller
    namespace: backup-system
