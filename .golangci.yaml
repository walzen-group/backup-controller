# golangci-lint configuration. This repo's flake provides golangci-lint
# 2.13.2, which reads the v2 file schema: version: "2" at the top, formatters
# split out of linters. A v1 config on a v2 binary is rejected, not silently
# half-applied, so if this file ever fails to load the fix is here, not in the
# tool version.
#
# The set is strict: small functions, typed errors, exhaustive switches,
# checked type assertions. Test files and the test infrastructure (hack/,
# internal/testinfra/) skip only the size and structure checks. Code written
# before the strict set is waived for the size and structure checks alone in
# the legacy block below, one entry per function, line or file; every
# correctness linter applies to every file. A //nolint names its linter, why,
# and the step that removes it (nolintlint enforces the form).
version: "2"
run:
  # The envtest, conformance and e2e suites and the demo (e2e && demo) are
  # linted with the rest, so make lint and CI's golangci-lint step, which
  # both run golangci-lint with no flags, cover every file those tags build.
  # No file is built only without one of these tags, so setting them all
  # leaves no file out.
  build-tags:
    - envtest
    - conformance
    - e2e
    - demo
  relative-path-mode: gitroot
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - funlen
    - gocognit
    - nestif
    - goconst
    - revive
    - dupl
    - unparam
    - nakedret
    - nolintlint
    - errname
    - exhaustive
    - gocritic
    - nilerr
    - forcetypeassert
    - contextcheck
    - unconvert
    - predeclared
    - copyloopvar
    - intrange
    - usestdlibvars
    - loggercheck
  settings:
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-string-values: ['^(spec|status|metadata|name|namespace)$']
    dupl:
      threshold: 120
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      enable-default-rules: true
      rules:
        - name: file-length-limit
          arguments: [{max: 300, skipComments: true, skipBlankLines: true}]
        - name: function-result-limit
          arguments: [3]
        - name: argument-limit
          arguments: [6]
        - name: max-control-nesting
          arguments: [4]
        - name: confusing-results
        - name: early-return
        - name: unused-receiver
        - name: bare-return
        - name: deep-exit
        - name: defer
        - name: identical-branches
        - name: modifies-value-receiver
        - name: unconditional-recursion
        - name: datarace
  exclusions:
    rules:
      - path: '_test\.go$'
        linters: [funlen, gocognit, nestif, goconst, dupl, forcetypeassert, unparam, contextcheck]
      - path: '_test\.go$'
        linters: [revive]
        text: '^(file-length-limit|function-result-limit|argument-limit|max-control-nesting|confusing-results)'
      - path: '^(hack/|internal/testinfra/)'
        linters: [funlen, gocognit, nestif, goconst, dupl]
      - path: '^(hack/|internal/testinfra/)'
        linters: [revive]
        text: '^(file-length-limit|function-result-limit|argument-limit|max-control-nesting|confusing-results)'
      # legacy:begin
      # Code written before the strict set. Only the size and structure
      # checks are waived, each for the named function, line or file; every
      # correctness linter applies everywhere. A step that brings a function
      # under the thresholds deletes its name here; a step that changes a
      # listed function's signature or a listed line either brings it under
      # the thresholds or updates the entry in the same change. Empty at v0.9.0.
      - path: '^internal/quiesce/plan\.go$'
        linters: [funlen, gocognit]
        source: '^func Plan\('
      - path: '^internal/quiesce/(plan|quiesce|stop)\.go$'
        linters: [goconst]
      - path: '^internal/quiesce/restart\.go$'
        linters: [funlen, gocognit]
        source: '^func Restart\('
      - path: '^internal/runs/backup_admit\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*BackupRunReconciler\) admit\('
      - path: '^internal/runs/backup_admit\.go$'
        linters: [nestif]
        source: '^\s*if queue != "" \{$'
      - path: '^internal/runs/backup_plan\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*BackupRunReconciler\) items\('
      - path: '^internal/runs/backup_quiesce\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*BackupRunReconciler\) quiesce\('
      - path: '^internal/runs/backup_quiesce\.go$'
        linters: [nestif]
        source: '^\s*if len\(run\.Status\.Quiesced\) == 0 \{$'
      - path: '^internal/runs/backup_volume\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*BackupRunReconciler\) startItem\('
      - path: '^internal/runs/backup_work\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*BackupRunReconciler\) work\('
      - path: '^internal/runs/backup_work\.go$'
        linters: [nestif]
        source: '^\s*if run\.Spec\.All && run\.Status\.RestartedAt == nil && len\(run\.Status\.Quiesced\) > 0 \{$'
      - path: '^internal/runs/(backup_database|backup_end|backup_quiesce|backup_volume|clusterwebhook|objects|release_report|restorerun)\.go$'
        linters: [goconst]
      - path: '^internal/runs/restorerun\.go$'
        linters: [revive]
        text: '^file-length-limit:'
      - path: '^internal/runs/crdcheck\.go$'
        linters: [funlen, gocognit]
        source: '^func walkFields\('
      - path: '^internal/runs/release_report\.go$'
        linters: [revive]
        text: '^confusing-results:'
        source: '^func releaseFailure\('
      - path: '^internal/runs/restorerun\.go$'
        linters: [funlen, gocognit]
        source: '^func \(r \*RestoreRunReconciler\) (plan|items|clustersRestoredElsewhere|work|restoreDatabase|quiesce|finalize)\('
      - path: '^internal/runs/restorerun\.go$'
        linters: [revive]
        text: '^confusing-results:'
        source: '^func \(r \*RestoreRunReconciler\) checkDatabase\('
      - path: '^internal/runs/restorerun\.go$'
        linters: [nestif]
        source: '^\s*if (stopped\(run\) && anyRestorePending\(run\.Status\.Items\) |volumesDone |len\(run\.Status\.Quiesced\) == 0 )\{$'
      - path: '^internal/runs/schedule\.go$'
        linters: [funlen, gocognit]
        source: '^func \(s \*Scheduler\) Reconcile\('
      - path: '^internal/runs/schedule\.go$'
        linters: [nestif]
        source: '^\s*if !due\.After\(now\) \{$'
      # legacy:end
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable: [gofmt, goimports]
